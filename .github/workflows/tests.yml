name: Python tests

on:
  push:
    branches:
      - main
      - feature/phase1-virtual-mirror
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 编译检查
        run: python -m compileall -q monitor mirror tests run.py test_email.py
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v
